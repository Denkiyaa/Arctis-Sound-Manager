name: IndexNow

# Tells Bing (and through it DuckDuckGo, Ecosia, Yahoo), Yandex, Seznam and
# Naver that a docs page changed, instead of waiting for their crawlers to come
# back. Google and Brave do not take part in IndexNow: Google is fed by the
# sitemap submitted in Search Console, Brave crawls on its own.
#
# The key is public by design: docs/<key>.txt is how the search engines check
# that the submission comes from the site owner. Because the key file lives
# under /Arctis-Sound-Manager/, only URLs below that path can be submitted —
# which is the whole site.

on:
  push:
    branches: [main]
    paths:
      - "docs/**.md"
      - "docs/**.html"
  # Manual run submits every URL of the sitemap (e.g. after a bulk change).
  workflow_dispatch:

permissions:
  contents: read
  pages: read

env:
  SITE: https://loteran.github.io/Arctis-Sound-Manager
  KEY: 4c9593853082e76c9cbb15f52501dfee

jobs:
  submit:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Submitting before GitHub Pages has published the commit would have the
      # engines fetch the old page and consider it up to date.
      - name: Wait for GitHub Pages to publish this commit
        run: |
          for _ in $(seq 60); do
            read -r commit status < <(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" --jq '"\(.commit) \(.status)"')
            if [ "$status" = built ] && git merge-base --is-ancestor "$GITHUB_SHA" "$commit"; then
              exit 0
            fi
            [ "$status" = errored ] && { echo "Pages build errored"; exit 1; }
            sleep 10
          done
          echo "Pages did not publish ${GITHUB_SHA} within 10 minutes"; exit 1

      - name: Collect changed URLs
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ "${{ github.event.before }}" = 0000000000000000000000000000000000000000 ]; then
            curl -fsSL "$SITE/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' > urls.txt
          else
            git diff --name-only --diff-filter=AM "${{ github.event.before }}" "$GITHUB_SHA" -- 'docs/**.md' 'docs/**.html' \
              | sed -e 's|^docs/||' -e 's|\.md$|.html|' -e 's|index\.html$||' -e "s|^|$SITE/|" > urls.txt
          fi
          cat urls.txt

      - name: Submit to IndexNow
        run: |
          [ -s urls.txt ] || { echo "Nothing to submit"; exit 0; }
          jq -n --rawfile urls urls.txt --arg key "$KEY" --arg site "$SITE" '{
            host: "loteran.github.io",
            key: $key,
            keyLocation: "\($site)/\($key).txt",
            urlList: ($urls | split("\n") | map(select(length > 0)))
          }' > payload.json
          # 200 = accepted, 202 = accepted, key validation pending (first submission).
          code=$(curl -s -o response.txt -w '%{http_code}' -H 'Content-Type: application/json; charset=utf-8' \
            --data @payload.json https://api.indexnow.org/indexnow)
          echo "HTTP $code"; cat response.txt
          [ "$code" = 200 ] || [ "$code" = 202 ]

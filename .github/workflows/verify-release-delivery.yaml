name: Verify release delivery

# Confirms that the current release version actually landed on every distro
# channel (AUR, COPR, Launchpad PPA; PyPI is checked but soft). Two triggers:
#   - workflow_run  : right after "Create GitHub Release" — lenient (slow builds
#                     like Launchpad may still be Pending; that's tolerated here)
#   - schedule      : daily audit — strict (by now everything must be Published;
#                     a still-behind channel turns this red on purpose)
#   - workflow_dispatch : manual re-check of any version
on:
  workflow_run:
    workflows: ["Create GitHub Release"]
    types: [completed]
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to verify (e.g. 1.1.51); blank = latest release'
        required: false

jobs:
  verify:
    runs-on: ubuntu-latest
    # Needed by the "raise an issue" step below.
    permissions:
      contents: read
      issues: write
    # On the workflow_run trigger, only proceed if the release actually succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version to verify
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then
            V=$(gh release view --repo "${{ github.repository }}" --json tagName --jq '.tagName')
          fi
          V="${V#v}"
          echo "Verifying delivery for v$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Verify delivery across channels
        id: verify
        # Explicit `shell: bash` so GitHub runs this with `-eo pipefail`. The
        # default shell has no pipefail, and piping into tee would hand back
        # tee's exit code — the step would pass while the check failed, which is
        # the exact class of bug this workflow is here to stop.
        shell: bash
        run: |
          set +e
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            # Fresh release: tolerate still-building channels, poll up to 45 min.
            python3 scripts/verify_release_delivery.py "${{ steps.ver.outputs.version }}" \
              --timeout 2700 --interval 90 | tee report.txt
          else
            # Daily/manual audit: everything must be delivered. Short poll absorbs
            # the rare case of a release cut minutes before the cron fired.
            python3 scripts/verify_release_delivery.py "${{ steps.ver.outputs.version }}" \
              --strict --timeout 1800 --interval 120 | tee report.txt
          fi
          rc=${PIPESTATUS[0]}
          set -e

          # Exit 2 means the check could not reach a verdict — an API timed out
          # or 5xx'd after retries — not that a channel is missing. Filing "the
          # release did not reach every channel" on that would be false, and a
          # check that cries wolf is one people stop reading: that is exactly how
          # the AUR noise hid a real regression in #176/#178. The daily audit
          # re-runs on its own, so a warning is the right weight here.
          if [ "$rc" = "2" ]; then
            echo "::warning::Delivery check could not verify every channel (network/API error). No channel is known to be missing; the daily audit will re-check."
            exit 0
          fi
          exit "$rc"

      # This check caught 1.2.15, 1.2.16 and 1.2.17 going out with no Fedora
      # package — it went red each time and nobody noticed, because a red run in
      # a secondary workflow is only seen by someone already looking. Fedora
      # users sat on 1.2.14 for three releases. A failure now files an issue,
      # which reaches the same inbox as a user's bug report. The title is fixed
      # per version so a daily re-check comments on the open issue instead of
      # opening a new one every morning.
      - name: Raise an issue when a channel is missing
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          TITLE="Release v${VERSION} did not reach every distro channel"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(printf '%s\n\n```\n%s\n```\n\n[Full run](%s)\n' \
            "Automated delivery check for **v${VERSION}** failed — at least one of AUR, COPR, PPA or PyPI is missing this version. Users on that distro are still on the previous release." \
            "$(tail -40 report.txt 2>/dev/null || echo 'no report captured')" \
            "$RUN_URL")
          EXISTING=$(gh issue list --repo "${{ github.repository }}" \
            --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "$TITLE" --body "$BODY" --label packaging || \
            gh issue create --repo "${{ github.repository }}" \
              --title "$TITLE" --body "$BODY"
          fi

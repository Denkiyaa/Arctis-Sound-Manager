name: Sync packaging version

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from pyproject.toml
        id: ver
        run: |
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Sync aur/PKGBUILD
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          sed -i "s/pkgver=.*/pkgver=${VERSION}/" aur/PKGBUILD

      - name: Sync aur/.SRCINFO
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          sed -i "s/pkgver = .*/pkgver = ${VERSION}/" aur/.SRCINFO
          sed -i "s/arctis-sound-manager-[0-9][0-9.]*\.tar\.gz/arctis-sound-manager-${VERSION}.tar.gz/g" aur/.SRCINFO
          sed -i "s|releases/download/v[0-9][0-9.]*/|releases/download/v${VERSION}/|g" aur/.SRCINFO

      - name: Sync RPM spec
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          sed -i "s/^Version:.*/Version:        ${VERSION}/" arctis-sound-manager.spec

      - name: Commit if anything changed
        run: |
          git config user.name "loteran"
          git config user.email "29098776+loteran@users.noreply.github.com"
          git add aur/PKGBUILD aur/.SRCINFO arctis-sound-manager.spec
          git diff --cached --quiet && echo "Already in sync — nothing to commit" && exit 0
          git commit -m "chore: sync packaging to v${{ steps.ver.outputs.version }} [skip ci]"

          # A release fires several jobs that each push to main, so this one can
          # find the branch moved on since checkout and be rejected as
          # non-fast-forward. That happened on v1.2.32 and left aur/PKGBUILD a
          # version behind while the AUR package itself was correctly updated:
          # the failure is in the bookkeeping, not the delivery, which makes it
          # easy to miss. Rebase and retry rather than fail the release over a
          # race that resolves itself.
          for attempt in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto the new tip"
            git pull --rebase origin main || exit 1
            sleep $((attempt * 5))
          done
          echo "::error::could not push the packaging sync after 3 attempts"
          exit 1

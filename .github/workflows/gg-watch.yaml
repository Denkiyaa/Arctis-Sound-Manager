name: SteelSeries GG watcher

# gg-watch.yaml
#
# Watch for new SteelSeries GG releases and act on what changed:
#   - new Sonar presets → commit to main (preset_sync reads from main)
#   - new device files or changed Arctis specs → open an issue
#   - changed GG builtins / HID transport (gg-disasm.py) → issue
#   - decoded specs and disassembly, regardless → mirrored to the private
#     loteran/steelseries-research repo (RESEARCH_REPO_TOKEN secret; skipped
#     if unset), never to this repo
#
# The back-merge workflow carries preset commits to develop.
#
# Trigger model:
#   - schedule: daily at 09:23 UTC (off the hour to avoid rush). A run with
#     no new GG version stops right after reading the latest version, so daily
#     costs a minute of runner time; weekly left GG 120.0.0 unpicked for days.
#   - workflow_dispatch: manual run with optional --since and --dry-run

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Replay delta from this version (e.g. 117.0.0)'
        required: false
      dry_run:
        description: 'Do not push or open issues'
        type: boolean
        default: false

concurrency:
  group: gg-watch
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      # The branch the run was started on: main for the cron, any branch for
      # a manual test of the watcher's own changes.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install 7z and the disassembler
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full python3-capstone python3-pefile

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run the watcher
        env:
          GG_WORKDIR: ${{ runner.temp }}/gg-watch
          ASM_ROOT: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Separate, narrowly-scoped token (contents:write on
          # loteran/steelseries-research only) — GITHUB_TOKEN above has no
          # write access outside this repo. Mirrors decoded specs there so
          # they're cloneable from any machine. Missing secret = step skips.
          RESEARCH_REPO_TOKEN: ${{ secrets.RESEARCH_REPO_TOKEN }}
        # Presets and state are pushed to the checked-out branch, and only
        # main is where they belong: off main, a run is always a dry run.
        run: |
          python3 scripts/reverse-engineering/gg-watch.py \
            ${{ inputs.since && format('--since={0}', inputs.since) || '' }} \
            ${{ (inputs.dry_run == true || github.ref_name != 'main') && '--dry-run' || '' }}
